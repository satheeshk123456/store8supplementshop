org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Configuration cache off: works around a confirmed Gradle bug on Windows that corrupts the
# transforms cache with a "Could not read workspace metadata ... metadata.bin" error, deterministically,
# on every build (fix lands in Gradle 9.4.0 — https://github.com/gradle/gradle/issues/28974).
# Build config is redone each run instead of cached — a bit slower, but reliable.
org.gradle.configuration-cache=false

# Parallel off: works around a separate confirmed Windows-only Gradle bug (antivirus intercepting
# file writes mid-move, "Could not move temporary workspace ... to immutable location", fixed in
# Gradle 9.1 — https://github.com/gradle/gradle/issues/28948). Running transforms one at a time
# instead of in parallel avoids the race that triggers it. Slower build, but won't fail.
org.gradle.parallel=false
