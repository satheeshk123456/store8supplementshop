name: store8
description: "Store 8 Supplement Shop — admin app (catalog management + order notifications)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.5.6
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.5.0

  # Navigation & state
  go_router: ^16.2.4
  provider: ^6.1.5

  # Networking
  dio: ^5.9.0
  connectivity_plus: ^6.1.5

  # Storage & media
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1

  # UI / formatting
  google_fonts: ^6.3.0
  intl: ^0.20.2

  # Splash video
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# Run once after `flutter pub get` to generate the real launcher icon on every platform:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0B0B"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0B0B0B"
    theme_color: "#0B0B0B"

# Run once after `flutter pub get` to generate the native (pre-Flutter-engine) launch screen:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0B0B"
  image: "assets/branding/logo_mark.png"
  android_12:
    color: "#0B0B0B"
    image: "assets/branding/logo_mark.png"
  web: false
